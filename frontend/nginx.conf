server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|ttf|woff2?|eot)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location = /delete {
        try_files /index.html =404;
    }

    location = /privacy {
        try_files /index.html =404;
    }

    location = /terms {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
