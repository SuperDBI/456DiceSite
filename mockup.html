<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>456Dice.com</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <style>
        @font-face {
            font-family: "DrippingMarker";
            src: url("ADrippingMarker-Ddw1.ttf") format("truetype");
            font-display: swap;
        }

        html {
            min-height: 100%;
            background-image: url('456dicebgrd.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #000; /* Ensure fallback color */
            z-index: -2; /* Ensure it is behind all content */
        }

        body {
            min-height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
            background: transparent; /* Ensure body does not block the background */
            color: white;
            z-index: -1; /* Place it behind all content */
        }

        header {
            display: flex; /* Use flexbox for alignment */
            align-items: center; /* Vertically align items */
            justify-content: center; /* Space out the logo and text */
            padding: 20px;
            background: transparent; /* Ensure header background does not block visibility */
            position: relative; /* Maintain proper stacking context */
            z-index: 1; /* Ensure it is above the background */
        }

        header h1 {
            font-size: clamp(4.5rem, 11vw, 9rem);
            margin: 0;
            font-family: "DrippingMarker", Arial, sans-serif;
            line-height: 0.95;
        }

        .favicon-logo {
            position: sticky;
            top: 0;
            margin-right: auto;
            margin-left: auto;
            width: 150px; /* Adjust size to fit in the row */
            height: 150px;
            background: transparent; /* Ensure full transparency */
            border: none;
            box-shadow: none;
            z-index: 1000; /* Ensure it stays above other elements */
            opacity: 0.8; /* Add slight transparency to the image */
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        nav a, nav button {
            text-decoration: none;
            color: black;
            background-color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        nav a:hover, nav button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.5);
        }

        .dropdown {
            display: none;
            flex-direction: column;
            gap: 5px;
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            position: absolute;
            top: 60px;
            left: 10px;
            z-index: 1000;
        }

        .dropdown a {
            padding: 10px;
            text-align: left;
        }

        .menu-toggle {
            display: none;
            background-color: white;
            color: black;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 768px) {
            nav {
                display: none;
            }

            .menu-toggle {
                display: block;
            }

            .favicon-logo {
                width: 200px;
                height: 200px;
            }

            nav a, nav button {
                padding: 8px 16px;
                font-size: 14px;
            }

            .screenshot img {
                max-width: 200px; /* Adjust for smaller screens */
            }
        }

        @media (max-width: 480px) {
            .favicon-logo {
                width: 150px;
                height: 150px;
            }

            nav {
                flex-direction: column;
                gap: 5px;
            }

            nav a, nav button {
                padding: 6px 12px;
                font-size: 12px;
            }

            .screenshot img {
                max-width: 150px; /* Adjust for very small screens */
            }
        }

        .screenshot img {
            width: 100%; /* Make images responsive */
            max-width: 140px; /* Reduced size by 50% */
            height: auto;
            border: 5px solid white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
        }

        .screenshot img:hover {
            transform: scale(1.05);
        }

        footer {
            position: fixed; /* Make the footer sticky */
            bottom: 0; /* Stick to the bottom of the screen */
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.5); /* Semi-transparent background */
            z-index: 1000; /* Ensure it stays above other elements */
            white-space: nowrap;
        }

        footer p {
            margin: 0;
        }

        .screenshot {
            display: flex;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0; /* Removed spacing between images */
            justify-content: center; /* Center the images */
            align-items: center; /* Align images in a row */
            padding: 20px;
        }

        .gallery-overlay {
            display: none; /* Ensure the overlay is hidden by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .gallery-overlay img {
            max-width: 90%;
            max-height: 90%;
            border: 5px solid white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .content-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10005;
        }

        .content-box {
            width: min(1000px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: black;
            border: 2px solid white;
            border-radius: 16px;
            padding: 30px;
            color: white;
            position: relative;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
        }

        .content-box h2 {
            margin-top: 0;
            font-size: clamp(2rem, 3vw, 2.8rem);
        }

        .content-box p,
        .content-box ul,
        .content-box li {
            color: white;
            line-height: 1.6;
        }

        .content-box a {
            color: #80d7ff;
            text-decoration: underline;
        }

        .content-box .tab-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .content-box .tab-buttons button {
            background: white;
            color: black;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .content-box .tab-buttons button.active {
            background: #80d7ff;
            color: black;
        }

        .page-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10005;
        }

        .page-box {
            width: min(1000px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: black;
            border: 2px solid white;
            border-radius: 16px;
            padding: 30px;
            color: white;
            position: relative;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
        }

        .page-box h2 {
            margin-top: 0;
            font-size: clamp(2rem, 3vw, 2.8rem);
        }

        .page-box p,
        .page-box ul,
        .page-box li {
            color: white;
            line-height: 1.6;
        }

        .page-box a {
            color: #80d7ff;
            text-decoration: underline;
        }

        .page-box .tab-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .page-box .tab-buttons button {
            background: white;
            color: black;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .page-box .tab-buttons button.active {
            background: #80d7ff;
            color: black;
        }

        .footer-links {
            display: inline-flex;
            gap: 20px;
            flex-wrap: nowrap;
            margin: 0 0 0 20px;
        }

        .footer-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            white-space: nowrap;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        @media (min-width: 1024px) {
            .screenshot {
                gap: 5px; /* Further reduced spacing for web view */
            }
        }

        .auth-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Center the container */
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .auth-container form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 300px;
        }

        .auth-container input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .auth-container button {
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .auth-container button:hover {
            background-color: #0056b3;
        }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .social-login img {
            width: 40px;
            height: 40px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <img class="favicon-logo" src="456ranklogo.png" alt="456Dice Logo">
        <h1 style="text-align: center; flex-grow: 1;">456Dice.com</h1>
    </header>

    <nav>
        <a href="https://www.456dice.com" data-page="home">Home</a>
        <a href="/download" data-page="download">Download</a>
        <a href="/social" data-page="social">Social Media</a>
        <a href="/about" data-page="about">About</a>
        <a href="/support" data-page="support">Support</a>
        <button id="login-btn" style="padding: 10px 20px; background-color: white; color: black; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);">Login</button>
        <button id="signup-btn" style="padding: 10px 20px; background-color: white; color: black; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);">Sign Up</button>
    </nav>

    <button class="menu-toggle" onclick="toggleMenu()">Menu</button>
    <div class="dropdown" id="dropdownMenu">
        <a href="/" data-page="home">Home</a>
        <a href="/download" data-page="download">Download</a>
        <a href="/social" data-page="social">Social Media</a>
        <a href="/about" data-page="about">About</a>
        <a href="/support" data-page="support">Support</a>
    </div>

    <div class="home-buttons" style="display: none;"> <!-- Removed from view -->
    </div>

        <div class="auth-overlay">
        <div class="auth-container">
            <button class="close-btn" style="position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 20px; cursor: pointer; color: black; font-weight: bold;">[X]</button>
            <h2>Login</h2>
            <form>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <div class="social-login" style="display: flex; justify-content: center; gap: 10px; margin-top: 20px;">
                <img src="images/openid-icon.png" alt="OpenID" style="width: 40px; height: 40px; cursor: pointer;">
                <img src="images/google-icon.png" alt="Google" style="width: 40px; height: 40px; cursor: pointer;">
                <img src="images/facebook-icon.png" alt="Facebook" style="width: 40px; height: 40px; cursor: pointer;">
                <img src="images/apple-icon.png" alt="Apple" style="width: 40px; height: 40px; cursor: pointer;">
            </div>
            <p>Don't have an account? <a href="#">Sign up</a></p>
        </div>
    </div>

    <div class="container">
        <div style="text-align: center;">
            <p style="text-align: center; border: 2px solid white; background-color: rgba(0, 0, 255, 0.5); padding: 10px; display: inline-block;">Experience the thrill of 4-5-6 Jackpot with our mobile app. Check out the screenshots below!</p>
        </div>

        <div class="screenshot">
            <img src="images/image1.png" alt="App Screenshot 1" onclick="openGallery(this.src)">
            <img src="images/image2.png" alt="App Screenshot 2" onclick="openGallery(this.src)">
            <img src="images/image3.png" alt="App Screenshot 3" onclick="openGallery(this.src)">
        </div>

        <div class="gallery-overlay" id="galleryOverlay">
            <button class="close-btn" onclick="closeGallery()">&times;</button>
            <img id="galleryImage" src="" alt="Gallery Image">
        </div>

        <div class="page-overlay" id="pageOverlay">
            <div class="page-box">
                <button class="close-btn" onclick="closePageOverlay()">&times;</button>
                <div class="tab-buttons">
                    <button type="button" id="pageTabDownload" onclick="showPageContent('download')">Download</button>
                    <button type="button" id="pageTabSocial" onclick="showPageContent('social')">Social Media</button>
                    <button type="button" id="pageTabAbout" onclick="showPageContent('about')">About</button>
                    <button type="button" id="pageTabSupport" onclick="showPageContent('support')">Support</button>
                </div>
                <div id="pageContent"></div>
            </div>
        </div>

        <div class="content-overlay" id="contentOverlay">
            <div class="content-box">
                <button class="close-btn" onclick="closeContentOverlay()">&times;</button>
                <div class="tab-buttons">
                    <button type="button" id="overlayTabDelete" onclick="showOverlayContent('delete')">Delete Data</button>
                    <button type="button" id="overlayTabPrivacy" onclick="showOverlayContent('privacy')">Privacy</button>
                    <button type="button" id="overlayTabTerms" onclick="showOverlayContent('terms')">Terms</button>
                </div>
                <div id="overlayContent"></div>
            </div>
        </div>

        <script>
            function openGallery(src) {
                const overlay = document.getElementById('galleryOverlay');
                const galleryImage = document.getElementById('galleryImage');
                galleryImage.src = src;
                overlay.style.display = 'flex';
            }

            function closeGallery() {
                const overlay = document.getElementById('galleryOverlay');
                overlay.style.display = 'none';
            }

            function openPageOverlay(page) {
                if (!page) return;
                const overlay = document.getElementById('pageOverlay');
                overlay.style.display = 'flex';
                showPageContent(page);
            }

            function closePageOverlay() {
                const overlay = document.getElementById('pageOverlay');
                overlay.style.display = 'none';
                history.replaceState({}, '', '/');
            }

            function showPageContent(page) {
                const content = document.getElementById('pageContent');
                const pages = {
                    download: `
                        <h2>Download</h2>
                        <p>Get the latest 456Dice app here once it is available.</p>
                        <p>More download details and links will be added later.</p>
                    `,
                    social: `
                        <h2>Social Media</h2>
                        <p>Follow 456Dice on social media for news, updates, and promotions.</p>
                        <p>More network links and social channel details will be added later.</p>
                    `,
                    about: `
                        <h2>About</h2>
                        <p>Learn about the 456Dice project, our mission, and our vision.</p>
                        <p>More company and product details will be added later.</p>
                    `,
                    support: `
                        <h2>Support</h2>
                        <p>Find help with the app, account, or game issues.</p>
                        <p>More support options and contact details will be added later.</p>
                    `
                };

                const pageKey = page.toLowerCase();
                if (!pages[pageKey]) return;

                content.innerHTML = pages[pageKey];
                document.querySelectorAll('.page-box .tab-buttons button').forEach(btn => {
                    btn.classList.toggle('active', btn.id === `pageTab${pageKey.charAt(0).toUpperCase() + pageKey.slice(1)}`);
                });
                history.replaceState({ page: pageKey }, '', `/${pageKey}`);
            }

            function showOverlayContent(page) {
                const content = document.getElementById('overlayContent');
                const pages = {
                    delete: `
                        <h2>User Data Deletion</h2>
                        <p>This overlay provides users with information on how to perform user data deletion.</p>
                        <p>More content will be added to this page later.</p>
                        <p><strong>Data deletion instructions URL:</strong> <a href="http://www.456dice.com/delete" target="_blank" rel="noopener">http://www.456dice.com/delete</a></p>
                    `,
                    privacy: `
                        <h2>Privacy Policy</h2>
                        <p>This overlay provides the privacy policy summary for 456Dice.</p>
                        <p>More content will be added to this page later.</p>
                        <p><strong>Privacy policy URL:</strong> <a href="http://www.456dice.com/privacy" target="_blank" rel="noopener">http://www.456dice.com/privacy</a></p>
                    `,
                    terms: `
                        <h2>Terms of Service</h2>
                        <p>This overlay provides the terms of service summary for 456Dice.</p>
                        <p>More content will be added to this page later.</p>
                        <p><strong>Terms of Service URL:</strong> <a href="http://www.456dice.com/terms" target="_blank" rel="noopener">http://www.456dice.com/terms</a></p>
                    `
                };

                const pageKey = page.toLowerCase();
                if (!pages[pageKey]) return;

                content.innerHTML = pages[pageKey];
                document.querySelectorAll('.content-box .tab-buttons button').forEach(btn => {
                    btn.classList.toggle('active', btn.id === `overlayTab${pageKey.charAt(0).toUpperCase() + pageKey.slice(1)}`);
                });
                history.replaceState({ page: pageKey }, '', `/${pageKey}`);
            }
        </script>

    </div>

    <footer>
        <p>&copy; 2026 456Dice.com. All rights reserved.</p>
        <div class="footer-links">
            <a href="/privacy" data-page="privacy">Privacy</a>
            <a href="/delete" data-page="delete">Delete Data</a>
            <a href="/terms" data-page="terms">Terms</a>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const authOverlay = document.querySelector('.auth-overlay');
            const closeButton = document.querySelector('.auth-container .close-btn');

            closeButton.addEventListener('click', () => {
                authOverlay.style.display = 'none';
            });

            const loginButton = document.getElementById('login-btn');
            const signupButton = document.getElementById('signup-btn');

            loginButton.addEventListener('click', () => {
                authOverlay.style.display = 'flex';
            });

            signupButton.addEventListener('click', () => {
                authOverlay.style.display = 'flex';
            });

            const loginForm = document.querySelector('.auth-container form');

            loginForm.addEventListener('submit', async (event) => {
                event.preventDefault();

                const email = loginForm.querySelector('input[type="email"]').value;
                const password = loginForm.querySelector('input[type="password"]').value;

                try {
                    const response = await fetch('https://your-backend-api/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        alert('Login successful!');
                        // Redirect or handle successful login
                    } else {
                        alert('Login failed. Please check your credentials.');
                    }
                } catch (error) {
                    console.error('Error during login:', error);
                    alert('An error occurred. Please try again later.');
                }
            });

            const footerLinks = document.querySelectorAll('.footer-links a');
            footerLinks.forEach(link => {
                link.addEventListener('click', event => {
                    event.preventDefault();
                    const page = link.dataset.page;
                    if (page) {
                        openContentOverlay(page);
                    }
                });
            });

            const currentPath = window.location.pathname.toLowerCase();
            if (['/privacy', '/delete', '/terms'].includes(currentPath)) {
                const pageName = currentPath.slice(1);
                openContentOverlay(pageName);
            }

            if (['/download', '/social', '/about', '/support'].includes(currentPath)) {
                const pageName = currentPath.slice(1);
                openPageOverlay(pageName);
            }
        });

        const navLinks = document.querySelectorAll('nav a[data-page], .dropdown a[data-page]');
        navLinks.forEach(link => {
            link.addEventListener('click', event => {
                const page = link.dataset.page;
                if (!page || page === 'home') return;
                event.preventDefault();
                openPageOverlay(page);
                const dropdown = document.getElementById('dropdownMenu');
                if (dropdown) dropdown.style.display = 'none';
            });
        });

        function toggleMenu() {
            const dropdown = document.getElementById('dropdownMenu');
            if (dropdown.style.display === 'flex') {
                dropdown.style.display = 'none';
            } else {
                dropdown.style.display = 'flex';
            }
        }
    </script>
</body>
</html>
